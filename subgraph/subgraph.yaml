specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: YiBiGame
    network: sepolia
    source:
      address: "0x1294cad0ed3b97b8052afcef040a3d65df3c2811"
      abi: YiBiGame
      startBlock: 10182959
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Level
        - Hint
        - SolveRecord
      abis:
        - name: YiBiGame
          file: ./abis/YiBiGame.json
      eventHandlers:
        - event: LevelCreated(indexed uint256,indexed address,string,uint8,uint256)
          handler: handleLevelCreated
        - event: LevelSolved(indexed uint256,indexed address,uint256,bool)
          handler: handleLevelSolved
      file: ./src/yibi-game.ts
